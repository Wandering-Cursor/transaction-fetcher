name: PR title check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate title follows release or chore convention
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(fix|feat|break|chore)(\([[:alnum:] _-]+\))?!?:\ .+ ]]; then
            echo "PR title matches the required convention."
            exit 0
          fi
          echo "PR title must start with one of: fix:, feat:, break:, chore: and include a description."
          exit 1
